# Gradle Properties
org.gradle.jvmargs = -Xmx4G
# JDKs available on this machine, used for toolchain resolution
org.gradle.java.installations.paths = D\:\\java21,D\:\\java25

# Source Options
# Use Modern Java(9+) Syntax (Courtesy of Jabel)
use_modern_java_syntax = true
use_jetbrains_annotations = true

# Compilation Options
generate_sources_jar = false
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = 1.0.0
root_package = com.jerry.mekextras
mod_id = mekanism_extras
mod_name = Mekanism Extras Legacy

# Mod Metadata (Optional)
mod_description = A legacy (1.12.2) port of Mekanism Extras for Mekanism CE Unofficial.
mod_url = https://github.com/Jerry-Modding/Mekanism-Extras
mod_update_json =
# Delimit authors with commas
mod_authors = Lost Myself, Jerry
mod_credits = Ported from Mekanism-Extras (NeoForge)
mod_logo_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = false

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false

# Publishing
release_type = release
client_side = true
server_side = true
publish_to_curseforge = false
publish_to_modrinth = false

# If any properties change below this line, refresh gradle again to ensure everything is working correctly.

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = false

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
use_mixins = false


